name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published advisory against existing code is found without a commit.
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest

    # CodeQL requires GitHub Advanced Security on private repositories. Without it the run
    # fails with a configuration error that says nothing about the code, which trains people
    # to ignore red builds. Public repositories get it for free, so scan there by default and
    # let a private repository opt in by setting the ENABLE_CODEQL variable once GHAS is on.
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
